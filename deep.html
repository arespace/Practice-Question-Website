<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="deep.css" />
<style>
/* ===== 深读：划词高亮 + 单元笔记（仅本页，沿用 styles.css 变量） ===== */
/* 划词后浮现的「标黄」按钮：贴在选区旁，位置由脚本夹在视口内 */
.deep-hl-btn {
  position: fixed;
  z-index: 70;
  left: 0;
  top: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 46%, transparent);
  background: linear-gradient(135deg, var(--accent), #8a6cff);
  color: #fff;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.deep-hl-btn[hidden] { display: none; }
.deep-hl-btn:hover { filter: brightness(1.07); }
.deep-hl-btn:active { transform: scale(0.97); }

/* 正文里的高亮：浅黄底、无下划线、跨行/长词不撑破 375px */
mark.deep-hl {
  background: color-mix(in srgb, #ffd34d 34%, transparent);
  color: inherit;
  text-decoration: none;
  border-radius: 3px;
  padding: 0 1px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
  overflow-wrap: anywhere;
}
[data-theme="light"] mark.deep-hl { background: color-mix(in srgb, #ffe97a 78%, transparent); }

/* 正文下方的「高亮 / 笔记」分区 */
.deep-xsec {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
}
.deep-xsec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 10.5px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.deep-xsec-acts, .deep-note-acts { display: flex; flex-wrap: wrap; gap: 6px; }

.deep-mark-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.deep-mark-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg-soft);
}
.deep-mark-text {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text-dim);
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.deep-mark-del {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-faint);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: 0.14s;
}
.deep-mark-del:hover { color: var(--no); border-color: var(--no); }

.deep-note-btn {
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-soft);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
  transition: 0.14s;
}
.deep-note-btn:hover { color: var(--text); border-color: var(--accent); }
.deep-note-btn.primary {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 44%, transparent);
  background: var(--accent-soft);
}
.deep-note-btn.danger:hover { color: var(--no); border-color: var(--no); }

.deep-note-body { font-size: 12.5px; line-height: 1.75; color: var(--text-dim); min-width: 0; }
.deep-note-line { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.deep-note-empty { margin: 0; font-size: 11.5px; line-height: 1.7; color: var(--text-faint); }
.deep-note-input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-height: 86px;
  max-height: 320px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  line-height: 1.7;
  resize: vertical;
}
.deep-note-input:focus { outline: none; border-color: var(--accent); }
.deep-note-count { margin-top: 5px; font-size: 10px; color: var(--text-faint); }

@media (max-width: 520px) {
  .deep-mark-text { font-size: 11px; }
  .deep-note-body { font-size: 12px; }
}
</style>
</head>
<body class="deep-page" data-page="deep">
<div class="bg-grid" aria-hidden="true"></div>

<header class="app-header">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开章节目录">☰</button>
  <a class="brand" href="index.html" title="返回速背卡片">
    <div class="brand-mark">D<span>·</span></div>
    <div class="brand-text">
      <h1 id="deepBrand">深读 · 基础知识</h1>
      <p id="deepSub">15 章 · 122 单元 · 本质 / 实战 / 面试讲法 / 真实坑 / 练习</p>
    </div>
  </a>
  <nav class="page-switch">
    <a href="index.html">速背卡</a>

    <a href="quiz.html">检测题</a>
    <a href="algo.html">算法练习</a>

  <div class="header-stats">
    <div id="dirSwitch"></div>

    <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换明暗主题">◐</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="rail-head">
      <div>
        <p class="rail-eyebrow">深读</p>
        <h2 class="rail-title">章节目录</h2>
      </div>
      <button class="icon-btn close-btn" id="closeBtn" aria-label="关闭">×</button>
    </div>

    <div class="sidebar-head">
      <input id="deepSearch" class="search" type="search" placeholder="搜索单元标题 / 关键词…" autocomplete="off" />
    </div>

    <div class="rail-block deep-prio-block">
      <div class="rail-label">面试频次</div>
      <div class="chip-row" id="deepPrio">
        <button type="button" class="chip active" data-p="all">全部</button>
        <button type="button" class="chip" data-p="P0">P0</button>
        <button type="button" class="chip" data-p="P1">P1</button>
        <button type="button" class="chip" data-p="P2">P2</button>
      </div>
      <p class="deep-prio-hint" id="deepPrioHint">P0 为三天精读范围</p>
    </div>

    <div class="rail-block deep-toc-block">
      <div id="deepToc" class="deep-toc"></div>
      <div id="deepResults" class="deep-results" hidden></div>
    </div>

    <div class="sidebar-foot deep-foot" id="deepFoot"></div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="stage deep-stage">
    <div class="stage-bar">
      <button type="button" class="deep-crumb" id="deepCrumb" aria-label="打开章节目录">—</button>
      <div class="deck-info"><span id="deepPos">0 / 0</span></div>
    </div>

    <button type="button" class="deep-resume" id="deepResume" hidden></button>

    <article class="deep-article" id="deepArticle">加载中…</article>

    <div class="empty card" id="deepEmpty" hidden>
      <h3>这个单元还没有内容</h3>
      <p>换一个单元，或重新运行 node tools/deep.js 检查内容源。</p>
    </div>

    <div class="stage-nav">
      <button class="nav-btn" id="prevUnit">← 上一单元</button>
      <span class="kbd-hint">←/→ 切换单元 · / 聚焦搜索</span>
      <button class="nav-btn" id="nextUnit">下一单元 →</button>
    </div>
  </main>
</div>

<button type="button" class="deep-hl-btn" id="deepHlBtn" hidden>标黄</button>
<div class="toast" id="toast"></div>

<script src="dist/dirs.js"></script>
<script src="store.js"></script>
<script src="markdown.js"></script>
<script src="deep.js"></script>

</html>
